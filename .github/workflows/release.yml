name: Release

on:
  push:
    tags: ["v*"]

# A tag push is not a place to discover the tests are red.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(uv run --no-project python -c '
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          ')"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged in pyproject.toml"
            exit 1
          fi

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      - run: uv build
      - name: Check the artifacts render on PyPI
        run: uv run --with twine twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # the OIDC token; no API token stored anywhere
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      # Afterwards: activate the new version on Read the Docs — tags arrive inactive.
      # See RELEASING.md.
