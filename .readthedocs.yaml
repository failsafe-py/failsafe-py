version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # Overriding the build step, so mkdocs.fail_on_warning does not apply: --strict
    # is the equivalent, and it is the point of the setup. A renamed parameter or a
    # dead cross-reference fails the build rather than rotting the published
    # reference. Never relax it to make a build pass.
    build:
      html:
        - uv run --group docs mkdocs build --strict --site-dir $READTHEDOCS_OUTPUT/html

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: mkdocs.yml
