site_name: failsafe-py API reference
site_description: API reference for failsafe-py, a port of failsafe-go.
site_url: https://failsafe-py.readthedocs.io/
repo_url: https://github.com/failsafe-py/failsafe-py
edit_uri: ""

# The prose site is Jekyll and lives elsewhere; this builds the generated reference only.
theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Entry points: reference/entry-points.md
  - Policies:
      - Retry: reference/retry.md
      - Circuit breaker: reference/circuit-breaker.md
      - Timeout: reference/timeout.md
      - Fallback: reference/fallback.md
      - Bulkhead: reference/bulkhead.md
      - Rate limiter: reference/rate-limiter.md
      - Hedge: reference/hedge.md
      - Cache: reference/cache.md
      - Budget: reference/budget.md
      - Adaptive throttler: reference/adaptive-throttler.md
      - Adaptive limiter: reference/adaptive-limiter.md
  - Vocabulary:
      - Conditions: reference/conditions.md
      - Delays: reference/delays.md
      - Priority: reference/priority.md
      - Events: reference/events.md
      - Exceptions: reference/exceptions.md
