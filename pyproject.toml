[project]
name = "failsafe-py"
version = "0.1.1"
description = "Fault tolerance and resilience policies for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Dumazet", email = "ndumazet@aire.ai" }]
keywords = ["resilience", "retry", "circuit-breaker", "timeout", "fault-tolerance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]

[project.urls]
Documentation = "https://failsafe-py.github.io"
"API Reference" = "https://failsafe-py.readthedocs.io"
Source = "https://github.com/failsafe-py/failsafe-py"
Changelog = "https://github.com/failsafe-py/failsafe-py/releases"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6", "httpx>=0.27"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/failsafe"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Working docs hold illustrative, deliberately-unformatted snippets.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
